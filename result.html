<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OOOsの結果発表</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; max-width: 800px; margin: auto; padding: 20px; background-color: #f9f9f9; text-align: center; color: #333; }
    .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #26466d; margin-bottom: 20px; }
    h2 { color: #26466d; border-bottom: 2px solid #26466d; padding-bottom: 10px; margin-top: 40px; margin-bottom: 20px; text-align: left; }

    /* 得点表示エリア */
    .score-container { margin-bottom: 20px; }
    .total-score { font-size: 1.4em; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .total-val { font-size: 1.8em; color: #26466d; }

    .sub-scores { display: flex; justify-content: space-around; background: #f8f9fa; padding: 15px; border-radius: 8px; font-size: 0.9em; }
    .sub-item strong { display: block; color: #26466d; font-size: 1.1em; margin-bottom: 5px; }

    /* チャートエリア */
    .chart-container {
      position: relative;
      width: 100%;
      height: 400px;
      margin: 20px auto;
    }

    /* 回答一覧リスト */
    .answer-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; text-align: left; }
    .answer-table th { background: #26466d; color: white; padding: 10px; text-align: center; }
    .answer-table td { border-bottom: 1px solid #ddd; padding: 10px; }
    .answer-table tr:nth-child(even) { background-color: #f9f9f9; }
    .ans-num { font-weight: bold; color: #26466d; text-align: center; width: 50px; }
    .ans-cat { text-align: center; width: 60px; font-weight: bold; color: #26466d; }
    .ans-val { font-weight: bold; font-size: 1.1em; text-align: center; width: 60px; }

    /* 結果解釈エリア */
    .first-section { margin-top: 10px; }
    .result-section { margin: 30px 0; text-align: left; }
    .rank-value { font-size: 1.8em; color: #e67e22; font-weight: bold; margin: 8px 0 14px; text-align: center; }
    .pattern-summary { color: #26466d; font-weight: bold; margin: 0 0 14px; }
    .membership-profile { display: grid; gap: 10px; margin-top: 14px; text-align: left; }
    .membership-row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 0.9em; }
    .membership-bar { display: block; width: 100%; height: 12px; background: #f0e1bd; border-radius: 999px; overflow: hidden; }
    .membership-fill { display: block; height: 100%; background: #26466d; border-radius: 999px; }
    .result-interpretation { margin-top: 18px; line-height: 1.8; }
    .result-interpretation p { margin: 0 0 8px; }
    .result-notes { margin-top: 16px; color: #555; font-size: 0.86em; line-height: 1.7; }
    .result-notes p { margin: 4px 0; }

    .quality-note { color: #777; font-size: 0.85em; margin-top: 12px; }
    .btn { display: inline-block; background: #26466d; color: white; padding: 12px 30px; text-decoration: none; border-radius: 6px; transition: 0.3s; font-weight: bold; margin-top: 20px; }
    .btn:hover { background: #1e3755; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

    @media (max-width: 600px) {
      .card { padding: 22px; }
      .sub-scores { gap: 8px; }
      .answer-table { font-size: 0.82em; }
      .answer-table td, .answer-table th { padding: 8px 6px; }
    }
  </style>
</head>
<body>

<div class="card">
  <h1>OOOsの結果</h1>

  <h2 class="first-section">総合結果</h2>

  <div class="score-container">
    <div class="total-score">
      合計得点：<span class="total-val" id="totalScore">0</span> <span style="font-size:0.7em; color:#888;">/ 150</span>
    </div>
    <div class="sub-scores">
      <div class="sub-item"><strong>OCP</strong><span id="ocpVal">0</span> / 48</div>
      <div class="sub-item"><strong>OFP</strong><span id="ofpVal">0</span> / 48</div>
      <div class="sub-item"><strong>OBP</strong><span id="obpVal">0</span> / 54</div>
    </div>
  </div>

  <div class="chart-container">
    <canvas id="oooChart"></canvas>
  </div>

  <div class="result-section">
    <h2>総得点ベースの目安</h2>
    <div class="rank-value" id="totalScoreRankValue">Rank -相当</div>
  </div>

  <div class="result-section">
    <h2>回答パターンの類似性（参考）</h2>
    <p class="pattern-summary" id="patternRankSummary">回答パターン上もっとも近いRank：Rank -</p>
    <div class="membership-profile" id="membershipProfile"></div>
    <div class="result-interpretation" id="resultInterpretation"></div>
    <div class="result-notes">
      <p>※回答パターンの類似性は、合計得点だけでなく、各項目の回答の組み合わせも考慮して算出されています。</p>
      <p>※現時点の潜在ランク推定は、検証用サンプルサイズが十分とは言えないため、暫定的な参考情報です。能力判定や処遇判断には用いず、自己省察の手がかりとして確認してください。</p>
    </div>
  </div>

  <h2>あなたの回答一覧</h2>
  <table class="answer-table">
    <thead>
      <tr>
        <th>No.</th>
        <th>分類</th>
        <th>質問項目</th>
        <th>回答</th>
      </tr>
    </thead>
    <tbody id="answer-list-body"></tbody>
  </table>

  <p class="quality-note" id="quality-note"></p>

  <a href="index.html" class="btn">トップへ戻る</a>
</div>

<script src="lrt-estimator.js"></script>
<script>
  const res = JSON.parse(sessionStorage.getItem('ooo_result'));

  if (!res) {
    alert("データが見つかりませんでした。最初からやり直してください。");
    location.href = 'index.html';
  }

  document.getElementById('totalScore').innerText = res.total_score;
  document.getElementById('ocpVal').innerText = res.ocp_score;
  document.getElementById('ofpVal').innerText = res.ofp_score;
  document.getElementById('obpVal').innerText = res.obp_score;

  const RANK_LEVEL_LABELS = {
    1: '低めの水準',
    2: 'やや低めから中程度の水準',
    3: '中程度以上の水準',
    4: '高い水準'
  };

  const RANK_TENDENCY_TEXTS = {
    1: 'OOOs全体として、自己認識にはまだ伸びしろがある傾向が示されています。',
    2: 'OOOs全体として、自己認識は形成途上にある傾向が示されています。',
    3: 'OOOs全体として、一定の自己認識傾向が示されています。',
    4: 'OOOs全体として、高い自己認識傾向が示されています。'
  };

  function getMembershipValues(result) {
    if (Array.isArray(result.rank_membership)) {
      return result.rank_membership.map(Number);
    }
    if (typeof result.rank_membership_profile === 'string') {
      const values = result.rank_membership_profile.split(',').map(Number);
      if (values.length >= 4) return values.slice(0, 4);
    }
    return [
      result.rank_membership_rank1,
      result.rank_membership_rank2,
      result.rank_membership_rank3,
      result.rank_membership_rank4
    ].map(Number);
  }

  function normalizeRmpProbabilities(rmpProbabilities) {
    const values = (rmpProbabilities || []).slice(0, 4).map((value) => {
      const number = Number(value);
      if (!Number.isFinite(number) || number < 0) return 0;
      return number > 1 ? number / 100 : number;
    });

    while (values.length < 4) values.push(0);
    return values;
  }

  function getTotalScoreRank(totalScore) {
    const score = Number(totalScore);
    if (!Number.isFinite(score)) return null;
    if (score < 76.2345) return 1;
    if (score < 88.7135) return 2;
    if (score < 100.776) return 3;
    return 4;
  }

  function getPatternRank(rmpProbabilities) {
    const probabilities = normalizeRmpProbabilities(rmpProbabilities);
    const total = probabilities.reduce((sum, value) => sum + value, 0);
    if (total <= 0) return null;

    const maxProbability = Math.max(...probabilities);
    return probabilities.indexOf(maxProbability) + 1;
  }

  function getRankUncertainty(rmpProbabilities) {
    const probabilities = normalizeRmpProbabilities(rmpProbabilities);
    const total = probabilities.reduce((sum, value) => sum + value, 0);
    if (total <= 0) {
      return { isUncertain: true, maxProbability: 0, secondProbability: 0 };
    }

    const sorted = probabilities.slice().sort((a, b) => b - a);
    const maxProbability = sorted[0];
    const secondProbability = sorted[1] || 0;
    return {
      isUncertain: maxProbability < 0.6 || (maxProbability - secondProbability) < 0.15,
      maxProbability,
      secondProbability
    };
  }

  function getResultInterpretation(totalScore, totalScoreRank, patternRank, rmpProbabilities) {
    const score = Number(totalScore);
    const scoreText = Number.isFinite(score) ? `${score}点` : '合計得点';
    const levelLabel = RANK_LEVEL_LABELS[totalScoreRank] || '判定が難しい水準';
    const paragraphs = [];

    if (!totalScoreRank || !patternRank) {
      paragraphs.push('回答パターンの類似性は、参考情報として確認してください。');
    } else if (totalScoreRank === patternRank) {
      paragraphs.push(`合計得点${scoreText}は${levelLabel}に位置します。`);
      paragraphs.push(`また、回答パターンもRank ${patternRank}に最も近い結果でした。`);
      paragraphs.push(`この結果から、${RANK_TENDENCY_TEXTS[totalScoreRank]}`);
    } else if (patternRank < totalScoreRank) {
      paragraphs.push(`合計得点${scoreText}は${levelLabel}に位置します。`);
      paragraphs.push(`一方で、一部の項目に低得点が集中していたため、回答パターンとしてはRank ${patternRank}型に近い結果となりました。`);
      paragraphs.push('これは、全体の得点水準と項目ごとのばらつきの両方を反映した参考結果です。');
    } else {
      paragraphs.push(`合計得点はRank ${totalScoreRank}相当ですが、一部の項目で高得点がまとまっているため、回答パターンとしてはRank ${patternRank}型に近い結果となりました。`);
      paragraphs.push('これは、全体の得点水準と項目ごとのばらつきの両方を反映した参考結果です。');
    }

    if (getRankUncertainty(rmpProbabilities).isUncertain) {
      paragraphs.push('なお、隣接するランクとの違いが明確ではないため、ランクは幅をもって解釈してください。');
    }

    return paragraphs;
  }

  function renderRankProbabilityBars(rmpProbabilities) {
    const probabilities = normalizeRmpProbabilities(rmpProbabilities);
    const profile = document.getElementById('membershipProfile');
    profile.innerHTML = '';

    probabilities.forEach((value, index) => {
      const percent = Math.max(0, Math.min(100, value * 100));
      const row = document.createElement('div');
      row.className = 'membership-row';
      row.innerHTML = `
        <span>Rank ${index + 1}</span>
        <span class="membership-bar"><span class="membership-fill" style="width:${percent}%"></span></span>
        <strong>${percent.toFixed(1)}%</strong>
      `;
      profile.appendChild(row);
    });
  }

  function renderRankResults(result) {
    const membership = normalizeRmpProbabilities(getMembershipValues(result));
    const totalScoreRank = getTotalScoreRank(res.total_score);
    const patternRank = getPatternRank(membership);
    const interpretation = getResultInterpretation(res.total_score, totalScoreRank, patternRank, membership);

    document.getElementById('totalScoreRankValue').innerText = totalScoreRank
      ? `Rank ${totalScoreRank}相当`
      : 'Rank -相当';
    document.getElementById('patternRankSummary').innerText = patternRank
      ? `回答パターン上もっとも近いRank：Rank ${patternRank}`
      : '回答パターン上もっとも近いRank：Rank -';

    renderRankProbabilityBars(membership);

    const interpretationElement = document.getElementById('resultInterpretation');
    interpretationElement.innerHTML = '';
    interpretation.forEach((text) => {
      const paragraph = document.createElement('p');
      paragraph.innerText = text;
      interpretationElement.appendChild(paragraph);
    });
  }

  const savedMembership = getMembershipValues(res);
  if (savedMembership.some((value) => Number.isFinite(value))) {
    renderRankResults(res);
  } else if (window.OOOS_LRT && res.responses) {
    window.OOOS_LRT.estimate(res.responses).then(renderRankResults).catch(() => {
      renderRankResults({ rank_membership: [] });
    });
  } else {
    renderRankResults({ rank_membership: [] });
  }

  const ocpRate = (res.ocp_score / 48) * 100;
  const ofpRate = (res.ofp_score / 48) * 100;
  const obpRate = (res.obp_score / 54) * 100;

  const ctx = document.getElementById('oooChart').getContext('2d');
  new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['OCP (作業中心)', 'OFP (作業焦点)', 'OBP (作業基盤)'],
      datasets: [{
        label: 'スコア',
        data: [ocpRate, ofpRate, obpRate],
        backgroundColor: 'rgba(38, 70, 109, 0.2)',
        borderColor: '#26466d',
        borderWidth: 3,
        pointBackgroundColor: '#fff',
        pointBorderColor: '#26466d',
        pointRadius: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          suggestedMin: 0,
          suggestedMax: 100,
          ticks: { display: false },
          pointLabels: {
            font: { size: 14, weight: 'bold', family: "'M PLUS Rounded 1c', sans-serif" },
            color: '#26466d'
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false }
      }
    }
  });

  const oooQuestions = [
    { id: 1, cat: "OFP", text: "クライエントにとって意味のある作業を特定できる。" },
    { id: 2, cat: "OBP", text: "クライエントの作業に関する課題を解決するために、作業の難易度を段階づけることができる。" },
    { id: 3, cat: "OCP", text: "クライエントの作業に影響する環境要因（道具・空間・人的支援など）を把握できる。" },
    { id: 4, cat: "OFP", text: "クライエントの現在の作業に関する課題を明確にすることができる。" },
    { id: 5, cat: "OBP", text: "クライエントに合う作業を見つけるため、実際の作業を体験する機会を提供できる。" },
    { id: 6, cat: "OFP", text: "クライエントと協働し、作業に関する目標を設定できる。" },
    { id: 7, cat: "OCP", text: "クライエントの健康・幸福のために、作業がなぜ必要か説明できる。" },
    { id: 8, cat: "OFP", text: "クライエントの作業に対する主観的な経験（重要度、実行度など）を評価できる。" },
    { id: 9, cat: "OBP", text: "クライエントが実際に行う作業を観察し、人・環境・作業の相互関係を分析できる。" },
    { id: 10, cat: "OCP", text: "クライエントにとっての作業の意味や価値がなぜ重要か説明できる。" },
    { id: 11, cat: "OFP", text: "クライエントの作業に関する課題と、役割や習慣の関係を評価し、介入計画を立案できる。" },
    { id: 12, cat: "OBP", text: "クライエントが実際に行う作業の質（努力性・効率性・安全性・自立性）を観察評価できる。" },
    { id: 13, cat: "OCP", text: "クライエントの作業を、過去・現在・未来という時系列のつながりとして捉えることができる。" },
    { id: 14, cat: "OFP", text: "クライエントの作業に関する目標の達成度を継続的に評価することができる。" },
    { id: 15, cat: "OBP", text: "クライエントが実際の作業を行う過程で、手本・介助・助言や問いかけを使い分け、最適な方法の習得を支援できる。" },
    { id: 16, cat: "OCP", text: "クライエントが直面する課題を、身体機能や精神機能だけでなく、作業との関連で捉えることができる。" },
    { id: 17, cat: "OFP", text: "クライエントに作業の意味や価値への気づきを促すことができる。" },
    { id: 18, cat: "OBP", text: "クライエントが作業を通して、自分らしく生きているという実感がもてるよう支援できる。" },
    { id: 19, cat: "OCP", text: "クライエントの作業が、所属する集団の慣習や社会的背景の影響を受けることを理解できる。" },
    { id: 20, cat: "OFP", text: "クライエントの作業への参加のため、周囲の理解を促し、支援的な環境を整えるよう働きかけることができる。" },
    { id: 21, cat: "OBP", text: "クライエントが役割や居場所を得られるよう、実際の作業を用いて支援できる。" },
    { id: 22, cat: "OCP", text: "クライエントが生きるうえで、作業がなぜ必要か説明できる。" },
    { id: 23, cat: "OBP", text: "クライエントの課題解決のため、なじみのある生活環境（自宅・地域など）で作業を用いた介入ができる。" },
    { id: 24, cat: "OBP", text: "クライエントのなじみのある生活環境（自宅・地域など）で介入が困難な場合、類似した模擬的な環境で作業を用いた介入ができる。" },
    { id: 25, cat: "OCP", text: "クライエントの作業に関する課題に対して、状況に応じた多様な専門的推論（リーズニング）を使い分けることができる。" }
  ];

  const tbody = document.getElementById('answer-list-body');
  oooQuestions.forEach(q => {
    const tr = document.createElement('tr');
    const val = res.responses['q' + q.id];

    tr.innerHTML = `
      <td class="ans-num">${q.id}</td>
      <td class="ans-cat">${q.cat}</td>
      <td>${q.text}</td>
      <td class="ans-val">${val}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('quality-note').innerText =
    res.quality_check_passed ? '' : '※回答内容の確認が必要な項目があります。';
</script>

</body>
</html>
